# =============================================================================
# DUCHENLIN-20261023 / 阶段 3：源站加固（Nginx 版）
# 落盘位置：/etc/nginx/conf.d/00-hardening.conf  +  server 段并入站点配置
#
# 重要前提（2026-10-23 实测）：duchenlin.top 的"源站"是 Cloudflare Worker
# （wrangler.toml: name = "duchenlin-blog"，main = src/worker.ts），
# 没有 IP、没有 80/443 入站端口、没有 nginx。
# 所以本文件的定位是：将来一旦迁到真实 VPS/容器源站，直接套用即满足阶段 3 全部要求；
# 现阶段与之等价的保护已经由"源站无入站端口"天然达成（审计项 S1 已 PASS）。
#
# 备份（改前必做）：
#   TS=$(date -u +%Y%m%dT%H%M%SZ)
#   tar czf /root/nginx-before-$TS.tgz /etc/nginx
# 回滚：
#   tar xzf /root/nginx-before-$TS.tgz -C / && nginx -t && nginx -s reload
# =============================================================================

# ---------------------------------------------------------------- http 段全局
# server_tokens off 抹掉版本号；四个超时收紧慢速攻击面；8m 与站点上传上限对齐。
server_tokens off;
client_max_body_size 8m;
client_body_timeout 12s;
client_header_timeout 12s;
keepalive_timeout 15s;
send_timeout 15s;
reset_timedout_connection on;

# ------------------------------------------------ 真实客户端 IP（Cloudflare）
# 只有来自 CF 段的连接才允许改写 X-Forwarded-For，否则任何直连者都能伪造 IP。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ------------------------------------------------------ CF 回源白名单（geo）
# 非 CF 来源在 server 段 return 444（直接断连，不回任何字节）。
geo $is_cf {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# ------------------------------------------------------------- 限速 key 回落
# 关键：不能直接拿 $http_cf_connecting_ip 当 key。
# 直连源站的请求没有这个头 → key 为空 → nginx 对空 key 不做计数 → 完全绕过限速。
# 所以空值必须回落到 $binary_remote_addr。
map $http_cf_connecting_ip $limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone  $limit_key zone=perip:10m      rate=20r/s;
limit_conn_zone $limit_key zone=conn_perip:10m;
limit_req_status 429;
limit_conn_status 429;

# --------------------------------------------------------- 方法白名单（map 版）
map $request_method $method_denied {
    default 1;
    GET 0; HEAD 0; POST 0; PUT 0; DELETE 0; PATCH 0; OPTIONS 0;
}

# ------------------------------------------------------------------ server 段
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name duchenlin.top www.duchenlin.top;

    # 1) 非 CF 来源直接 444：IP 泄漏后被直连也打不动。
    if ($is_cf = 0) { return 444; }

    # 2) 方法白名单
    if ($method_denied) { return 405; }

    # 3) TLS
    ssl_certificate     /etc/letsencrypt/live/duchenlin.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duchenlin.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # 4) 限速
    limit_req  zone=perip burst=40 nodelay;
    limit_conn conn_perip 30;

    # 5) 安全响应头（edge 已设一份，这里是纵深第二份，同名以 edge 为准）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 6) 敏感路径拦截（放在通用 location 之前，正则 location 优先级更高）
    location ~* /(\.git|\.env|\.svn|wp-admin|actuator|server-status|\.DS_Store) {
        access_log off;
        return 404;
    }

    # 7) 登录/注册更严的独立限速
    location = /api/site/login    { limit_req zone=perip burst=5  nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location = /api/site/register { limit_req zone=perip burst=3  nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location = /api/admin/login   { limit_req zone=perip burst=3  nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # 8) 隐藏上游指纹，避免版本/框架泄漏
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header X-AspNet-Version;
    }
}

# 80 端口不服务任何内容：要么交给 CF 的 Always Use HTTPS，要么直接关掉。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
