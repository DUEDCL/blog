# Cloudflare Workers 静态资源部署配置。
#
# 构建流程：Workers Builds 先跑构建命令（npm run build）生成 dist/，
# 再跑部署命令（npx wrangler deploy），由本文件决定怎么部署。
#
# 三个容易踩的坑：
# 1. dashboard 里 Worker 的名字必须和下面的 name 完全一致，否则构建会失败。
# 2. 下面每个 [[routes]] 都要求对应的 zone 已经是本账号下「活动(Active)」状态。
#    任何一个还是 pending，整个 deploy 都会失败 —— 先加站点、改 NS、等 Active，
#    再触发构建。
# 3. Cloudflare 的 NS 是按 zone 随机分配的，两个域名拿到的是不同的一对。
#    照抄另一个域名的 NS 会导致永远激活不了（踩过：duchenlin.top 填了
#    duchenlin.eu.cc 的 alfred/itzel，而它自己分到的是 gloria/watson）。
#
# 4. 有了 main 之后，线上多了**运行期故障面**：以前构建失败只是不部署、线上不受影响，
#    现在 Worker 抛异常就是 500。所以 src/worker.ts 里每条路径都要兜底，
#    并且非 /api/music/* 一律 return env.ASSETS.fetch(request) 交回静态资源。

name = "duchenlin-blog"
compatibility_date = "2026-08-19"

# 点歌台的取数接口（/api/music/*）。这一行是 R6 那道「单向门」——
# 在它出现之前本站没有一行服务端代码在跑。门第 11 轮已批准，点歌台把它提前了。
main = "src/worker.ts"

# workers.dev 入口与版本预览 URL —— 两个都关，2026-08-23。
#
# 关的理由不是省钱：<name>.<账号子域>.workers.dev 里那段「账号子域」不由我们取名，
# 它的取值本身就是一条账号标识（与账号邮箱同类），等于把账号信息挂在一个
# 公开可访问的域名上。三个自定义域名都已 Active，原来留它的理由
# （DNS 还没生效时用它先验证站点）已经不存在了。
#
# 两个键必须都写。wrangler 源码 getSubdomainValues() 里 defaultPreviewUrls = undefined，
# 也就是**不写 preview_urls 时 deploy 压根不去动这个开关**；只关 workers_dev 会留下
# https://<VERSION_PREFIX>-<name>.<账号子域>.workers.dev 这条按版本自动生成的公开链接
# （wrangler 自己会为这种混合状态发警告，原文：「you may want to disable the
# Preview URLs as well by setting `preview_urls = false`」）。
#
# 线上已先用 API 关掉（POST /accounts/{id}/workers/scripts/{name}/subdomain
# → {"enabled":false,"previews_enabled":false}），这两行是为了让后续 deploy 不翻回来。
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
# Workers 不会自动认出 404.html，必须显式声明；Pages 是自动的，这是两者的差异
not_found_handling = "404-page"
# 有了 main 就必须给 assets 一个绑定名，否则 Worker 里没法把请求交回静态资源
binding = "ASSETS"
# 只有这些路径先进 Worker，其余请求连 Worker 都不唤起（省调用数，也少一个故障点）。
# 数组形式要 wrangler >= 4.20.0（官方 changelog 确认），本项目 ^4.124.0 满足
run_worker_first = [ "/api/music/*", "/api/chat", "/api/admin/*" ]

# 「AI 版沉麟」的**兜底**推理（R6 阶段②）。免费档 10,000 neurons/天，超额直接报错、不自动计费。
# 兜底模型与它的账记在 src/data/chat.ts 顶部：@cf/qwen/qwen3-30b-a3b-fp8，约每天 196 次对话。
#
# **主路不在这个文件里。** R34 起对话优先走一个 OpenAI 兼容端点，它的地址、模型名与密钥
# 三样都是 Worker secret（`CHAT_BASE` / `CHAT_KEY` / `CHAT_MODEL`），一个字都不进仓库 ——
# 这个仓库是公开的，而沉麟的要求是站上不体现那条链路的任何信息。
# 三样缺一样、或者主路这一次失败，`/api/chat` 就自动退回下面这个绑定。
[ai]
binding = "AI"

# 对话落库（R32：改成落库、永久保留）。一个会话一个实例，实例名就是会话 id。
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatLog"

# `storage = "sqlite"` 不是可选项：**Workers Free 只支持 SQLite 后端的 DO**
# （KV 后端要 Paid，官方 pricing 页原文）。这一行写错就等于要为对话功能升级付费档。
# 用的是新的 [exports] 写法而不是 legacy 的 [[migrations]] + new_sqlite_classes ——
# 类名与生命周期都由这里声明，wrangler 4.x 的当前文档就是这套。
[exports.ChatLog]
type = "durable-object"
storage = "sqlite"

# 裸域直接指向本 Worker。Cloudflare 会自动创建 DNS 记录并签发证书，
# 不需要手工加 A/CNAME 记录（裸域按 DNS 规范不能用 CNAME，这里由 Cloudflare 内部解决）
#
# 主域：国内可直连
[[routes]]
pattern = "duchenlin.top"
custom_domain = true

# 有人会习惯性输 www，一并绑上。canonical 仍指向裸域，不会分散权重
[[routes]]
pattern = "www.duchenlin.top"
custom_domain = true

# 备用域：国内被中间设备按主机名 RST，只有境外能直连，留着当第二入口
[[routes]]
pattern = "duchenlin.eu.cc"
custom_domain = true
